plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace "com.example.expirytrack"
    compileSdk 36

    defaultConfig {
        applicationId "com.example.expirytrack"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Load Gemini API Key from local.properties
        def localProps = new Properties()
        def localPropsFile = rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { stream -> localProps.load(stream) }
        }
        def geminiKey = localProps.getProperty('GEMINI_API_KEY', '')
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Firebase BOM
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'

    // ML Kit Text Recognition
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // CameraX
    implementation 'androidx.camera:camera-camera2:1.3.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.0'
    implementation 'androidx.camera:camera-view:1.3.0'

    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.5'
    implementation 'androidx.navigation:navigation-ui:2.7.5'

    // WorkManager (for scheduled notifications)
    implementation 'androidx.work:work-runtime:2.8.1'

    // Preference
    implementation 'androidx.preference:preference:1.2.1'

    // MPAndroidChart (for charts/graphs)
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Gemini AI
    implementation("com.google.ai.client.generativeai:generativeai:0.9.0")

    // Facebook Shimmer (loading animation)
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Gson (for JSON serialization)
    implementation 'com.google.code.gson:gson:2.10.1'

    // Lottie (for JSON animations)
    implementation 'com.airbnb.android:lottie:6.4.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
